<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 设计令牌：与工具栏面板同一支色板 */
  :root {
    --bg:       #FAF9F6;
    --bg-hover: #F1EEE6;
    --line:     #E5E2DA;
    --ink:      #2B2B2B;
    --ink-2:    #666666;
    --ink-3:    #999999;
    --accent:   #3868E6;
    --accent-h: #2B55C4;
    --accent-t: rgba(56, 104, 230, 0.10);
    --r-md:     8px;
    --ease:     0.12s ease;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 14px;
  }
  h2 { font-size: 14px; margin-bottom: 4px; }
  .hint { font-size: 12px; color: var(--ink-3); margin-bottom: 10px; line-height: 1.6; }
  textarea {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: #fff;
    padding: 10px;
    font-size: 13px;
    line-height: 1.7;
    font-family: inherit;
    color: var(--ink);
    resize: none;
    outline: none;
    transition: border-color var(--ease);
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-family: inherit;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: background var(--ease), color var(--ease), border-color var(--ease);
  }
  button:hover { background: var(--bg-hover); }
  #save {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  #save:hover { background: var(--accent-h); }
  #count { font-size: 12px; color: var(--accent); margin-top: 8px; text-align: right; }
</style>
</head>
<body>
  <h2>自定义词库</h2>
  <div class="hint">一行一条词句。填充时每个选中的文本图层随机取一条（相邻不重复）。</div>
  <textarea id="box" spellcheck="false" placeholder="例如：&#10;新品上市，全场 8 折&#10;限时优惠，先到先得&#10;会员专享福利"></textarea>
  <div id="count"></div>
  <div class="row">
    <button id="cancel">取消</button>
    <button id="save">保存</button>
  </div>
  <script>
    var box = document.getElementById('box')
    var count = document.getElementById('count')
    function refreshCount() {
      var n = box.value.split('\n').filter(function (l) { return l.trim().length > 0 }).length
      count.textContent = n + ' 条词句'
    }
    box.oninput = refreshCount
    window.__setWords = function (arr) {
      box.value = (arr || []).join('\n')
      refreshCount()
    }
    try { window.postMessage('requestWords', '') } catch (e) { /* 浏览器直开时无 Sketch 通信桥，忽略 */ }
    document.getElementById('save').onclick = function () {
      var arr = box.value.split('\n').map(function (l) { return l.trim() }).filter(function (l) { return l.length > 0 })
      window.postMessage('saveWords', JSON.stringify(arr))
    }
    document.getElementById('cancel').onclick = function () {
      window.postMessage('close', '')
    }
    refreshCount()
    box.focus()
  </script>
</body>
</html>
