<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* ---------- 设计令牌 ---------- 与工具栏面板 / iconfont 官网装修同一支色板 */
  :root {
    --bg:        #FAF9F6;
    --bg-hover:  #F1EEE6;
    --line:      #E5E2DA;
    --line-soft: #F0EDE6;
    --ink:       #2B2B2B;
    --ink-2:     #666666;
    --ink-3:     #999999;
    --ink-4:     #C9C4B8;
    --accent:    #3868E6;
    --accent-h:  #2B55C4;
    --accent-t:  rgba(56, 104, 230, 0.10);
    --seal:      #C0392B;
    --r-sm:      6px;
    --r-md:      8px;
    --ease:      0.12s ease;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--ink);
    user-select: none;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  /* ---------- 黑色顶栏（与官网模式装修后的顶栏同款） ---------- */
  header {
    background: #1F1F1F;
    color: var(--bg);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }
  .seal {
    width: 22px; height: 22px;
    background: var(--seal);
    border-radius: 4px;
    color: #fff;
    font-size: 13px;
    line-height: 22px;
    text-align: center;
    font-weight: 600;
    flex: none;
  }
  header b { font-size: 14px; flex: 1; }
  .ins-lbl { font-size: 11px; color: #DDD; flex: none; }
  /* 插入图标开关：只对 iconfont 官网模式生效，本地模式点击即插入，故置灰展示 */
  #insTgl {
    width: 34px; height: 18px;
    border-radius: 9px;
    background: #4A4A4A;
    position: relative;
    cursor: pointer;
    flex: none;
    opacity: 0.45;
  }
  #insTgl i {
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
  }
  .mbtn {
    border: 1px solid rgba(250,249,246,0.35);
    background: transparent;
    color: var(--bg);
    border-radius: var(--r-sm);
    font-size: 11px;
    padding: 5px 10px;
    cursor: pointer;
    flex: none;
    white-space: nowrap;
    font-family: inherit;
    transition: background var(--ease), border-color var(--ease);
  }
  .mbtn:hover { background: rgba(250,249,246,0.15); }
  .mbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mbtn.on:hover { background: var(--accent-h); }
  /* ---------- 搜索行 ---------- */
  #searchRow {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    align-items: center;
    flex: none;
  }
  /* 圆角搜索框 + 框内放大镜（无独立搜索按钮，回车触发） */
  #sbox {
    flex: 1;
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    padding: 0 10px;
    min-width: 0;
    transition: border-color var(--ease), background var(--ease);
  }
  #sbox:focus-within { border-color: var(--accent); background: #fff; }
  #q {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 8px 0;
    font-size: 13px;
    outline: none;
    color: var(--ink);
    font-family: inherit;
  }
  #sbox svg { flex: none; color: var(--ink-3); }
  #sizes { display: flex; gap: 4px; align-items: center; flex: none; }
  #sizes span { font-size: 11px; color: var(--ink-3); margin-right: 2px; }
  .sz {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: var(--r-sm);
    font-size: 11px;
    padding: 6px 8px;
    cursor: pointer;
    color: var(--ink-2);
    font-family: inherit;
    transition: background var(--ease), border-color var(--ease), color var(--ease);
  }
  .sz:hover { background: var(--bg-hover); }
  .sz.on { background: var(--accent-t); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  /* ---------- 图标墙：白底 + 细网格线，紧凑 6 列（Kitchen 式） ---------- */
  #grid {
    flex: 1;
    overflow: auto;
    overscroll-behavior: contain;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 0;
    align-content: start;
    background: #fff;
  }
  #grid::-webkit-scrollbar { width: 8px; }
  #grid::-webkit-scrollbar-track { background: transparent; }
  #grid::-webkit-scrollbar-thumb { background: #DCD8CE; border-radius: 4px; border: 2px solid #fff; }
  #grid::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }
  .card {
    background: #fff;
    border: 0;
    border-right: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    border-radius: 0;
    padding: 12px 4px 10px;
    text-align: center;
    cursor: pointer;
    transition: background var(--ease);
  }
  .card:hover { background: #F0F5FE; }
  .card:active { background: #E1EBFD; }
  .card .svg-box { width: 28px; height: 28px; margin: 0 auto; }
  .card .svg-box svg { width: 28px; height: 28px; display: block; }
  .card .ld { font-size: 14px; color: #D5D2C8; line-height: 28px; }
  /* ---------- 分页器 ---------- */
  #pager {
    flex: none;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 10px;
    background: #fff;
    border-top: 1px solid var(--line);
  }
  #pager.show { display: flex; }
  .pg {
    min-width: 26px;
    height: 26px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: var(--r-sm);
    font-size: 12px;
    padding: 0 6px;
    cursor: pointer;
    color: var(--ink-2);
    font-family: inherit;
    transition: background var(--ease), border-color var(--ease), color var(--ease);
  }
  .pg:hover:not(:disabled) { background: var(--bg-hover); }
  .pg.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .pg:disabled { opacity: 0.4; cursor: default; }
  .pg-ellipsis { font-size: 12px; color: #BBB; padding: 0 2px; }
  #pager .info { font-size: 11px; color: #AAA; margin-left: 8px; }
  /* ---------- 空态 / 提示 ---------- */
  .hint {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
    padding: 44px 20px;
    line-height: 2;
  }
  .hint b { display: block; font-size: 14px; color: var(--ink); margin-bottom: 6px; }
  .hint kbd {
    display: inline-block;
    min-width: 18px;
    padding: 1px 5px;
    margin: 0 2px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: #fff;
    font-size: 11px;
    color: var(--ink-2);
    font-family: inherit;
  }
  #toast {
    position: absolute;
    left: 50%; bottom: 48px;
    transform: translateX(-50%);
    background: rgba(31,31,31,0.92);
    color: #fff;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: var(--r-sm);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    max-width: 80%;
    z-index: 10;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <header>
    <span class="seal">墨</span>
    <b>图标库</b>
    <span class="ins-lbl" title="插入图标开关仅对 iconfont 官网模式生效">插入图标</span>
    <span id="insTgl" title="插入图标开关仅对 iconfont 官网模式生效"><i></i></span>
    <button class="mbtn on" id="localBtn">本地·iconify</button>
    <button class="mbtn" id="ifBtn" title="切换到 iconfont 官网：原生中文搜索，需登录 iconfont.cn">iconfont·官网</button>
  </header>

  <div id="searchRow">
    <div id="sbox">
      <input id="q" type="text" placeholder="请输入关键词" />
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    </div>
    <div id="sizes">
      <span>尺寸</span>
      <button class="sz" data-s="16">16</button>
      <button class="sz" data-s="24">24</button>
      <button class="sz on" data-s="32">32</button>
      <button class="sz" data-s="48">48</button>
      <button class="sz" data-s="64">64</button>
    </div>
  </div>

  <div id="grid">
    <div class="hint">
      <b>搜图标，点一下落到画布</b>
      支持中文（用户 / 购物车 / 首页…）与英文关键词<br>
      图标集：Ant Design · Material · Tabler 等<br>
      <kbd>⏎</kbd> 搜索　<kbd>点击</kbd> 插入
    </div>
  </div>

  <div id="pager"></div>

  <div id="toast"></div>

  <script>
    /* ---------- 中文 → 英文关键词映射 ---------- */
    var ZH2EN = {
      '用户': 'user person', '账号': 'account', '头像': 'avatar face', '登录': 'login',
      '搜索': 'search', '首页': 'home house', '设置': 'settings gear', '配置': 'settings gear',
      '添加': 'plus add', '新增': 'plus add', '删除': 'delete trash', '编辑': 'edit pencil',
      '关闭': 'close x', '保存': 'save', '下载': 'download', '上传': 'upload',
      '时间': 'time clock', '日期': 'date calendar', '日历': 'calendar', '时钟': 'clock',
      '地图': 'map', '位置': 'location pin', '电话': 'phone', '邮件': 'mail email',
      '消息': 'message', '聊天': 'chat', '评论': 'comment', '购物车': 'cart',
      '购物': 'shopping', '订单': 'order list', '支付': 'payment', '金钱': 'money',
      '钱包': 'wallet', '优惠': 'coupon ticket', '星星': 'star', '收藏': 'star bookmark',
      '点赞': 'like heart thumb', '喜欢': 'heart', '分享': 'share', '菜单': 'menu',
      '列表': 'list', '网格': 'grid', '图片': 'image photo picture', '相机': 'camera',
      '视频': 'video play', '音乐': 'music', '声音': 'volume speaker', '锁': 'lock',
      '钥匙': 'key', '眼睛': 'eye view', '密码': 'password lock', '团队': 'team group users',
      '公司': 'building office', '图表': 'chart', '数据': 'chart data analytics', '文件': 'file document',
      '文件夹': 'folder', '链接': 'link', '代码': 'code', '电脑': 'computer desktop',
      '手机': 'mobile phone smartphone', '网络': 'wifi network', '云': 'cloud', '服务器': 'server',
      '通知': 'notification bell', '警告': 'warning alert', '帮助': 'help question', '信息': 'info',
      '成功': 'success check', '错误': 'error', '加载': 'loading spinner refresh', '刷新': 'refresh',
      '过滤': 'filter', '排序': 'sort', '复制': 'copy', '剪切': 'cut scissors',
      '撤销': 'undo', '重做': 'redo', '全屏': 'fullscreen expand', '退出': 'logout exit',
      '注册': 'register signup', '箭头': 'arrow', '对勾': 'check tick', '心形': 'heart',
      '闪电': 'lightning bolt', '太阳': 'sun', '月亮': 'moon', '天气': 'weather',
      '旅行': 'travel plane', '汽车': 'car', '礼物': 'gift', '标签': 'tag',
      '书': 'book', '笔': 'pen pencil', '画笔': 'brush', '工具': 'tool wrench',
      '房子': 'home house', '家': 'home house family', '地球': 'earth globe world',
      '世界': 'world globe', '国家': 'country flag', '国旗': 'flag',
      '人': 'person user people', '男人': 'man male', '女人': 'woman female',
      '小孩': 'child kid baby', '手势': 'hand', '花朵': 'flower', '树': 'tree',
      '植物': 'plant leaf', '动物': 'animal', '狗': 'dog', '猫': 'cat',
      '食物': 'food', '餐': 'restaurant meal', '咖啡': 'coffee', '茶': 'tea',
      '饮料': 'drink cup', '水': 'water drop', '火箭': 'rocket', '飞机': 'plane airplane',
      '游戏': 'game', '电影': 'movie film', '电视': 'tv television', '耳机': 'headphone',
      '打印': 'printer print', '电池': 'battery', '灯': 'lamp light bulb',
      '灯泡': 'bulb light', '火': 'fire flame', '雨': 'rain', '雪': 'snow',
      '风': 'wind', '蓝牙': 'bluetooth', '返回': 'back arrow left', '前进': 'forward arrow right',
      '地址': 'address location', '银行': 'bank', '信用卡': 'credit card',
      '折扣': 'discount sale', '会员': 'vip crown member', '排行': 'rank leaderboard',
      '排名': 'rank trophy', '热门': 'hot fire popular', '推荐': 'recommend thumb',
      '公告': 'announcement megaphone', '活动': 'activity event', '签到': 'checkin check',
      '积分': 'points coin', '客服': 'service support headset', '二维码': 'qrcode',
      '扫码': 'scan qrcode', '更多': 'more dots ellipsis', '顶部': 'top up arrow',
      '历史': 'history', '主题': 'theme palette', '颜色': 'color palette',
      '音量': 'volume', '静音': 'mute volume off', '表情': 'emoji face smile',
      '笑脸': 'smile emoji', '徽章': 'badge medal', '奖杯': 'trophy award',
      '钻石': 'diamond gem', '皇冠': 'crown', '包裹': 'package box', '箱子': 'box',
      '卡车': 'truck delivery', '定位': 'location gps pin', '导航': 'navigation',
      '路线': 'route', '闹钟': 'alarm clock', '秒表': 'timer stopwatch',
      '分钟': 'timer', '信号': 'signal', '网格视图': 'grid view', '缩放': 'zoom',
      '搜索放大': 'zoom search', '对话': 'conversation chat bubble', '气泡': 'bubble chat',
      '发送': 'send', '附件': 'attachment paperclip', '书签': 'bookmark',
      '日记': 'diary journal notebook', '报告': 'report document', '表格': 'table spreadsheet',
      '公式': 'formula function', '计算': 'calculator calculate', '数学': 'math calculator',
      '科学': 'science flask', '实验': 'experiment lab flask', '医生': 'doctor health',
      '医院': 'hospital', '药': 'medicine pill', '心脏': 'heart health', '安全': 'safety shield',
      '盾牌': 'shield', '警察': 'police', '法律': 'law justice', '法院': 'court law',
      '旗帜': 'flag', '引擎': 'engine', '齿轮': 'gear cog settings', '扳手': 'wrench tool',
      '锤子': 'hammer', '螺丝': 'screw', '电源': 'power', '插头': 'plug power',
      '电池充电': 'battery charging', '太阳能': 'solar energy', '能源': 'energy',
      '回收': 'recycle', '垃圾': 'trash delete', '瓶子': 'bottle', '杯子': 'cup'
    }
    /* 长词优先替换（"购物车" 必须先于 "购物"），键长序只需排一次，缓存起来 */
    var ZH_KEYS = Object.keys(ZH2EN).sort(function (a, b) { return b.length - a.length })
    var zhCache = {}
    function toEn(q) {
      if (zhCache[q] !== undefined) return zhCache[q]
      var out = ' ' + q + ' '
      ZH_KEYS.forEach(function (k) {
        if (out.indexOf(k) !== -1) out = out.split(k).join(' ' + ZH2EN[k] + ' ')
      })
      out = out.trim().replace(/\s+/g, ' ') || q
      zhCache[q] = out
      return out
    }

    var SIZE = 32
    var grid = document.getElementById('grid')
    var qInput = document.getElementById('q')
    var toastEl = document.getElementById('toast')
    var toastTimer = null

    function toast(msg) {
      toastEl.textContent = msg
      toastEl.classList.add('show')
      clearTimeout(toastTimer)
      toastTimer = setTimeout(function () { toastEl.classList.remove('show') }, 2400)
    }

    document.querySelectorAll('.sz').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('.sz').forEach(function (x) { x.classList.remove('on') })
        b.classList.add('on')
        SIZE = parseInt(b.getAttribute('data-s'), 10)
      }
    })
    // 「插入图标」开关仅对 iconfont 官网模式生效，本地模式点击图标即插入
    document.getElementById('insTgl').onclick = function () {
      toast('本地模式点击图标即插入；插入开关是 iconfont 官网模式用的')
    }
    // 切换到 iconfont 官网模式（插件侧 loadURL，同一窗口内导航，登录态/Cookie 原生保留）
    document.getElementById('ifBtn').onclick = function () {
      try { window.postMessage('gotoIconfont', '') } catch (e) { /* ignore */ }
    }
    // 中文输入法：候选词确认的回车（isComposing / keyCode 229）不触发搜索，
    // 否则拼音还没上屏就搜了，表现为"输入汉字搜不到结果"
    qInput.onkeydown = function (e) {
      if (e.isComposing || e.keyCode === 229) return
      if (e.key === 'Enter') doSearch()
    }
    qInput.focus()
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    }

    var allIcons = []   // 本次搜索全部结果（最多 999）
    var svgCache = {}   // key → svg 字符串 | null(失败)
    var cardBoxes = {}  // key → 缩略图容器元素

    /* ---------- 请求队列：每个图标集 1 个批量请求，间隔 250ms 防限流 ---------- */
    var queue = []
    var pumping = false
    function enqueue(fn) {
      queue.push(fn)
      if (!pumping) pump()
    }
    function pump() {
      if (!queue.length) { pumping = false; return }
      pumping = true
      var f = queue.shift()
      f().catch(function () { /* 单个集合失败不阻塞队列 */ }).then(function () {
        setTimeout(pump, 250)
      })
    }

    function svgFromEntry(set, name, data) {
      var it = data.icons && data.icons[name]
      if (!it || !it.body) return null
      var w = it.width || data.width || 24
      var h = it.height || data.height || 24
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + it.body + '</svg>'
    }

    function loadSet(set, names) {
      var url = 'https://api.iconify.design/' + set + '.json?icons=' + names.join(',')
      return fetch(url)
        .then(function (r) { return r.json() })
        .then(function (data) {
          names.forEach(function (n) {
            var key = set + ':' + n
            var svg = svgFromEntry(set, n, data)
            svgCache[key] = svg // null 表示该图标数据缺失
            var box = cardBoxes[key]
            if (box) {
              if (svg) box.innerHTML = svg
              else box.innerHTML = '<div class="ld">✕</div>'
              delete cardBoxes[key]
            }
          })
        })
    }

    function doSearch() {
      var raw = qInput.value.trim()
      if (!raw) return
      var en = toEn(raw)
      // 映射后仍含中文 = 本地词库未收录该词，Iconify 不认中文 → 提前提示
      var restZh = en.match(/[\u4e00-\u9fa5]+/g)
      if (restZh) {
        toast('「' + restZh.join('、') + '」暂未收录中文映射，试试英文关键词')
        en = en.replace(/[\u4e00-\u9fa5]+/g, ' ').replace(/\s+/g, ' ').trim()
        if (!en) return
      }
      grid.innerHTML = '<div class="hint">搜索中…</div>'
      pager.className = ''
      fetch('https://api.iconify.design/search?query=' + encodeURIComponent(en) + '&limit=999')
        .then(function (r) { return r.json() })
        .then(function (json) {
          allIcons = json.icons || []
          page = 1
          totalPages = Math.max(1, Math.ceil(allIcons.length / PER_PAGE))
          if (!allIcons.length) {
            grid.innerHTML = '<div class="hint"><b>没有找到「' + esc(raw) + '」</b>试试英文关键词，如 user / home / heart</div>'
            return
          }
          renderPage()
        })
        .catch(function (err) {
          grid.innerHTML = '<div class="hint"><b>搜索失败</b>请检查网络后重试<br><span style="color:var(--seal)">' + esc(err && err.message ? err.message : err) + '</span></div>'
        })
    }

    /* ---------- 分页渲染：页码翻页替代"显示更多" ---------- */
    var PER_PAGE = 100
    var page = 1
    var totalPages = 1
    var pager = document.getElementById('pager')

    function renderPage() {
      grid.innerHTML = ''
      grid.scrollTop = 0
      var bySet = {}
      var start = (page - 1) * PER_PAGE
      var end = Math.min(start + PER_PAGE, allIcons.length)
      for (var i = start; i < end; i++) {
        var full = allIcons[i]
        var idx = full.indexOf(':')
        var set = full.slice(0, idx)
        var name = full.slice(idx + 1)
        var key = set + ':' + name
        var card = document.createElement('div')
        card.className = 'card'
        card.title = key
        var box = document.createElement('div')
        box.className = 'svg-box'
        box.innerHTML = '<div class="ld">…</div>'
        card.appendChild(box)
        card.setAttribute('data-key', key)
        card.onclick = function () {
          insertCard(this.getAttribute('data-key'))
        }
        grid.appendChild(card)
        cardBoxes[key] = box
        ;(bySet[set] = bySet[set] || []).push(name)
      }
      // 按集合批量拉取 SVG 数据（入队串行，间隔 250ms）
      Object.keys(bySet).forEach(function (set) {
        enqueue(function () { return loadSet(set, bySet[set]) })
      })
      renderPager()
    }

    function renderPager() {
      var html = ''
      html += '<button class="pg" id="pgPrev"' + (page <= 1 ? ' disabled' : '') + '>‹ 上一页</button>'
      var nums = pageNumbers(page, totalPages)
      for (var i = 0; i < nums.length; i++) {
        var n = nums[i]
        if (n === '…') {
          html += '<span class="pg-ellipsis">…</span>'
        } else {
          html += '<button class="pg' + (n === page ? ' on' : '') + '" data-p="' + n + '">' + n + '</button>'
        }
      }
      html += '<button class="pg" id="pgNext"' + (page >= totalPages ? ' disabled' : '') + '>下一页 ›</button>'
      html += '<span class="info">' + allIcons.length + ' 个 · 第 ' + page + ' / ' + totalPages + ' 页</span>'
      pager.innerHTML = html
      pager.className = 'show'
      var prev = document.getElementById('pgPrev')
      var next = document.getElementById('pgNext')
      if (prev) prev.onclick = function () { gotoPage(page - 1) }
      if (next) next.onclick = function () { gotoPage(page + 1) }
      pager.querySelectorAll('.pg[data-p]').forEach(function (b) {
        b.onclick = function () { gotoPage(parseInt(this.getAttribute('data-p'), 10)) }
      })
    }

    // 页码序列：总页数少全显示；多则 1 … (c-1) c (c+1) … 末页
    function pageNumbers(c, total) {
      if (total <= 7) {
        var arr = []
        for (var i = 1; i <= total; i++) arr.push(i)
        return arr
      }
      var out = [1, '…']
      var s = Math.max(2, c - 1)
      var e = Math.min(total - 1, c + 1)
      if (s > 2) out.push('…')
      for (var j = s; j <= e; j++) out.push(j)
      if (e < total - 1) out.push('…')
      out.push(total)
      return out
    }

    function gotoPage(p) {
      if (p < 1 || p > totalPages || p === page) return
      page = p
      renderPage()
    }

    function insertCard(key) {
      var svg = svgCache[key]
      if (svg) {
        var name = key.slice(key.indexOf(':') + 1)
        try {
          window.postMessage('insertIcon', JSON.stringify({ svg: svg, name: name, size: SIZE }))
          toast('已插入画布 ✅ ' + name)
        } catch (e) {
          toast('插入失败：' + esc(e && e.message ? e.message : e))
        }
      } else if (svg === null) {
        toast('该图标数据缺失，请重新搜索')
      } else {
        toast('图标加载中，请稍候再点')
      }
    }
  </script>
</body>
